# Build downloadable executables, so a workshop participant needs no toolchain.
#
#   linux-static   a single static binary set for Linux and for WSL. Supported.
#   windows-exe    a native Windows .exe, cross-compiled with MinGW-w64.
#                  EXPERIMENTAL -- native Windows has never been a tested
#                  platform. This job may fail; it does not gate the release.
#
# Trigger by hand from the Actions tab, or by pushing a tag such as v26.08.
name: Release binaries

on:
  workflow_dispatch:          # the Actions tab, on any branch
  push:
    tags: [ 'v*' ]            # a tag builds and publishes a release

env:
  # The project standard compiler. A migration to 16 was made and REVERTED on
  # 2026-08-27: a gfortran-16 DEBUG build fails 34 of 71 short tests where a
  # gfortran-14 debug build of the same code passes exactly, on top of the
  # known -fcheck=bounds miscompilation. The 16 work is preserved on the branch
  # develop-gfortran-16; see DEFERRED.md. Flipping this back to 16 is the only
  # edit needed here, which is why the PPA machinery is kept.
  FC_VERSION: 14

jobs:

  linux-static:
    name: Linux (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the toolchain (gfortran-${{ env.FC_VERSION }})
        # NO PPA, DELIBERATELY. Ubuntu 24.04 carries gfortran-14 natively, and a
        # build compared against stored references must not silently change
        # where its packages come from: adding ppa:ubuntu-toolchain-r/test on
        # 2026-08-27 substituted its own build of 14 (14.3.0-12ubuntu1~24~ppa1)
        # and turned ci.yml red. Bring the PPA back only for a compiler Ubuntu
        # does not ship, and re-bless the references as a deliberate act.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y make cmake default-jdk gfortran-${FC_VERSION} python3
          command -v gfortran-${FC_VERSION} > /dev/null || {
            echo "::error::gfortran-${FC_VERSION} is not in the Ubuntu archive; refusing to ship a tarball built by another compiler."
            exit 1
          }
          gfortran-${FC_VERSION} --version | head -1

      - name: Build
        run: |
          cmake -B out -S . \
                -DCMAKE_Fortran_COMPILER=gfortran-${FC_VERSION} \
                -DCMAKE_BUILD_TYPE=release-static \
                -DCOMPILE_LAPACK=ON
          cmake --build out -- -j3

      - name: Check the binaries run and are self-contained
        run: |
          out/tonto --version
          out/hart --help > /dev/null
          file out/tonto out/hart
          ldd out/tonto || true          # "not a dynamic executable" is the goal

      - name: Run a workshop exercise against the built binary
        run: |
          cd workshop/examples/1-nh3-hart
          TONTO_BASIS_SET_DIRECTORY=$GITHUB_WORKSPACE/basis_sets \
            $GITHUB_WORKSPACE/out/hart --job nh3 --basis def2-SVP \
            --std-f nh3.hkl nh3.cif
          grep '^R(F)' nh3.out

      - name: Package
        run: |
          V=$(git describe --tags --always)
          D=tonto-$V-linux-x86_64
          # The archive itself has no version in its name, so that
          #   releases/latest/download/tonto-linux-x86_64.tar.gz
          # is a permanent direct link the workshop can print. The version is
          # in the directory inside it, and in what the programs report.
          # Binaries go in build/, the same place a compiled checkout puts
          # them, so every command in the workshop is identical whether the
          # reader downloaded this package or built the repository.
          mkdir -p $D/build
          cp out/tonto out/hart $D/build/
          [ -f out/rgbi ] && cp out/rgbi $D/build/ || true
          cp -r basis_sets workshop $D/
          cp README.md LICENSE $D/
          tar czf tonto-linux-x86_64.tar.gz $D
          echo "ARTEFACT=tonto-linux-x86_64.tar.gz" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: tonto-linux-x86_64
          path: ${{ env.ARTEFACT }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 \
            || gh release create ${{ github.ref_name }} --generate-notes \
                 --title "Tonto ${{ github.ref_name }}"
          gh release upload ${{ github.ref_name }} $ARTEFACT --clobber

  windows-exe:
    name: Windows .exe (experimental, may fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake default-jdk gfortran-mingw-w64 \
                                  gcc-mingw-w64-x86-64 wine64

      - name: Cross-compile
        run: |
          cmake -B out-win -S . \
                -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-toolchain.cmake \
                -DCMAKE_BUILD_TYPE=release \
                -DCOMPILE_LAPACK=ON \
                -DTONTO_WSL=OFF
          cmake --build out-win -- -j3

      - name: Check the .exe runs, and computes, under wine
        run: |
          file out-win/tonto.exe out-win/hart.exe
          WINE=$(command -v wine64 || command -v wine || true)
          if [ -z "$WINE" ]; then echo "no wine on this image -- not run"; exit 0; fi
          export WINEDEBUG=-all
          "$WINE" out-win/tonto.exe --version || { echo "tonto.exe did not run"; exit 0; }
          # Does it get the right answer? Exercise 1 of the workshop, whose
          # reference R(F) is 0.010071.
          cd workshop/examples/1-nh3-hart
          "$WINE" ../../../out-win/hart.exe --job nh3 --basis def2-SVP \
                  --basis-dir ../../../basis_sets --std-f nh3.hkl nh3.cif \
            || { echo "hart.exe did not complete under wine"; exit 0; }
          grep '^R(F)' nh3.out || echo "no R(F) in the output"

      - name: Package
        run: |
          V=$(git describe --tags --always)
          D=tonto-$V-windows-x86_64
          mkdir -p $D/build
          cp out-win/*.exe $D/build/
          cp -r basis_sets workshop $D/
          cp README.md LICENSE $D/
          zip -qr tonto-windows-x86_64.zip $D
          echo "ARTEFACT=tonto-windows-x86_64.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: tonto-windows-x86_64
          path: ${{ env.ARTEFACT }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 \
            || gh release create ${{ github.ref_name }} --generate-notes \
                 --title "Tonto ${{ github.ref_name }}"
          gh release upload ${{ github.ref_name }} $ARTEFACT --clobber
