name: Linux-MPI-debug

# The parallel debug build on Linux: gfortran-14, Open MPI built with the same
# compiler, array bounds checks and Tonto's internal checks live in the
# parallel code. Passes or fails on the pi check and on two short jobs at 2
# processes. The steps are in mpi-linux.yml, shared with ci-mpi.yml.

on:
  push:                      # TEMPORARY: run on this branch before merging; remove
    branches: [mpi-ci-gfortran14]
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 2'      # Tuesdays 05:37 UTC

jobs:
  mpi:
    uses: ./.github/workflows/mpi-linux.yml
    with:
      build_type: debug
