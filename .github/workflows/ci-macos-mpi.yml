name: macOS-MPI

# The parallel build on Apple silicon, built `reference` with gfortran-14
# against an Open MPI built with the same compiler. Passes or fails on the pi
# check; the short suite under MPI is shown but does not decide. The steps are
# in mpi-macos.yml, shared with ci-macos-mpi-debug.yml.

on:
  schedule:
    - cron: '51 4 * * 3'      # Wednesdays 04:51 UTC
  workflow_dispatch:

jobs:
  mpi:
    uses: ./.github/workflows/mpi-macos.yml
    with:
      build_type: reference
