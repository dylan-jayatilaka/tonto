name: CI (Linux-debug)

# Debug-build CI, separate from ci.yml so it gets its own badge.
#
# SCOPE, deliberately narrow: this builds `-DCMAKE_BUILD_TYPE=debug` and runs a
# couple of fast jobs to prove the binary actually executes. It does NOT run the
# full short suite yet, because the debug (-O0) build has 4 longstanding
# FP-boundary/structural failures documented in DEFERRED.md; wiring those
# in now would give a permanently red badge, which is worse than no badge.
# Widen the scope once those four are triaged.
#
# Why a debug job exists at all: the debug build is where preconditions
# (USE_PRECONDITIONS), WARN/WARN_IF and non-PURE probing live, so it is the build
# used for all debugging -- and it silently rotted (gfortran-16 debug segfaults
# on arm64 macOS, found 2026-07-30). A build+smoke gate stops that class of rot
# recurring unnoticed. NOTE: on gfortran 16 this build carries no -fcheck=bounds,
# because the compiler miscompiles the check itself; the assertion step below
# pins that down either way. Bounds checking returns when GCC fixes it.
# RE-ENABLED (2026-07-30), after the failure that caused it to be switched off was
# found and fixed: scripts/test.py was handed a *relative* --program, which
# run_test() then resolved from inside the temp directory it chdir's into. See
# docs/TONTO_CONTINUOUS_INTEGRATION.md. The fix is in test.py itself, so every caller is covered.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  # The project standard compiler. A migration to 16 was made and REVERTED on
  # 2026-08-27: a gfortran-16 DEBUG build fails 34 of 71 short tests where a
  # gfortran-14 debug build of the same code passes exactly, on top of the
  # known -fcheck=bounds miscompilation. The 16 work is preserved on the branch
  # develop-gfortran-16; see DEFERRED.md. Flipping this back to 16 is the only
  # edit needed here, which is why the PPA machinery is kept.
  FC_VERSION: 14

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain (gfortran-${{ env.FC_VERSION }})
        # From the toolchain PPA: Ubuntu 24.04 tops out at gcc-14. Assert it
        # landed rather than silently building one version labelled another.
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran-${FC_VERSION} libblas-dev liblapack-dev \
            default-jdk python3 perl gnuplot make cmake
          command -v gfortran-${FC_VERSION} > /dev/null || {
            echo "::error::gfortran-${FC_VERSION} did not install -- ppa:ubuntu-toolchain-r/test may not carry it for $(lsb_release -cs). Do NOT fall back to another version silently; fix the source or change FC_VERSION deliberately."
            exit 1
          }
          gfortran-${FC_VERSION} --version | head -1

      - name: Configure (debug)
        run: >
          cmake -B build-debug
          -DCMAKE_Fortran_COMPILER=gfortran-${{ env.FC_VERSION }}
          -DCMAKE_BUILD_TYPE=debug

      - name: Assert the -fcheck=bounds gate did the right thing
        # gfortran 16 miscompiles -fcheck=bounds, so the build drops it on 16 and
        # up and keeps it on 14. Both halves matter: losing it on 14 would remove
        # real checking, and keeping it on 16 would resurrect the segfault. The
        # same assertion runs on macOS; this is the Linux half.
        run: |
          FLAGS=build-debug/CMakeFiles/tonto.dir/flags.make
          if [ "${FC_VERSION}" -ge 16 ]; then
            grep -q 'fcheck=bounds' "$FLAGS" \
              && { echo "::error::gfortran-${FC_VERSION} debug still has -fcheck=bounds; see docs/GFORTRAN16_DEBUG_CRASH.md"; exit 1; }
            echo "ok: -fcheck=bounds correctly omitted on gfortran-${FC_VERSION}"
          else
            grep -q 'fcheck=bounds' "$FLAGS" \
              || { echo "::error::gfortran-${FC_VERSION} debug lost -fcheck=bounds; the version gate is too broad"; exit 1; }
            echo "ok: -fcheck=bounds correctly kept on gfortran-${FC_VERSION}"
          fi

      - name: Build (debug)
        # -j2 as in ci.yml: translation spawns one JVM per .foo file and the
        # runner has ~7 GB. Do not raise without watching RAM.
        run: cmake --build build-debug -- -j2

      - name: Smoke test (the binary must run, not just link)
        # Two fast jobs. The point is to catch a debug binary that builds but
        # dies immediately -- exactly the arm64 gfortran-16 segfault mode --
        # rather than to police numerics, so the tolerances are loose on purpose.
        run: |
          set -o pipefail
          for t in h2o_rhf_STO-3G h2o_rhf_cc-pVDZ; do
            echo "== $t =="
            python3 scripts/test.py \
              --test-directory "tests/short/$t" \
              --basis-sets basis_sets \
              --program build-debug/tonto \
              --log-level=ERROR
          done

      - name: Diagnostics on failure
        if: failure()
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1
          echo '## Debug-build diagnostics'
          echo '```'
          gfortran-${FC_VERSION} --version | head -1 || echo "gfortran-${FC_VERSION} MISSING"
          ls -l build-debug/tonto || echo "no debug binary"
          echo '```'
