name: WSL-MPI-debug

# The parallel debug build inside real WSL2: gfortran-14, Open MPI built with
# the same compiler, array bounds checks and Tonto's internal checks live in the
# parallel code. Passes or fails on the pi check and on two short jobs at 2
# processes. The steps are in mpi-wsl.yml, shared with ci-wsl-mpi.yml.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 6'      # Saturdays 05:23 UTC

jobs:
  wsl-mpi:
    uses: ./.github/workflows/mpi-wsl.yml
    with:
      build_type: debug
