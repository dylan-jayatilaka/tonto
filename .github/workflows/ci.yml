name: CI (Linux-release)

# Continuous integration for the ANTLR4 Foo->Fortran translator.
# Every push / PR to these branches: check out (with submodules), install the
# toolchain, build a release `tonto` from ANTLR4-generated Fortran, and run the
# short test suite through scripts/suite_report.py, which prints an
# Exact/Loose/Last-digit agreement table and exits non-zero iff any test fails
# the LOOSE gate (rel <= 0.2% OR last-digit <= 2). The table is surfaced on the
# run's front-page Job Summary and uploaded as an artifact.
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  BUILD_TYPE: release
  # The project standard compiler. Migrated 14 -> 16 on 2026-08-27; the one
  # known cost is that a DEBUG build loses -fcheck=bounds (a gfortran 16
  # code-generation bug, see docs/GFORTRAN16_DEBUG_CRASH.md), which does not
  # affect this release workflow at all.
  FC_VERSION: 16

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain (gfortran-${{ env.FC_VERSION }})
        # gfortran (Foo->Fortran target compiler) comes from the toolchain PPA:
        # Ubuntu 24.04's own repositories top out at gcc-14. Assert it landed --
        # falling through would build with 14 under a 16 label, which is the
        # silent-wrong-answer class this project keeps finding the hard way.
        # Also a full JDK (CMake needs javac to build the translator; the ANTLR
        # jar itself is auto-downloaded by CMake with a SHA-256 check),
        # BLAS/LAPACK from apt (so the LAPACK submodule isn't rebuilt from
        # source), plus python3/perl/gnuplot/make.
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran-${FC_VERSION} libblas-dev liblapack-dev \
            default-jdk python3 perl gnuplot make cmake
          command -v gfortran-${FC_VERSION} > /dev/null || {
            echo "::error::gfortran-${FC_VERSION} did not install -- ppa:ubuntu-toolchain-r/test may not carry it for $(lsb_release -cs). Do NOT fall back to 14 silently; fix the source or change FC_VERSION deliberately."
            exit 1
          }
          gfortran-${FC_VERSION} --version | head -1

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_Fortran_COMPILER=gfortran-${{ env.FC_VERSION }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        # -j2 is deliberate: translation spawns one JVM per .foo file, which is
        # memory-heavy on a shared 7 GB runner. Do not raise without watching RAM.
        run: cmake --build build -- -j2

      - name: Diagnostics (toolchain, binary, one raw test)
        if: always()   # run even if the build failed, so a red run self-diagnoses
        # Writes everything to the run's Job Summary (front page) so the root
        # cause is readable without opening step logs or pasting anything.
        run: |
          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1
          echo '## Diagnostics'
          echo '```'
          echo "== toolchain =="
          gfortran-${FC_VERSION} --version | head -1 || echo "gfortran-${FC_VERSION} MISSING"
          java -version 2>&1 | head -1 || echo "java MISSING"
          python3 --version || true
          echo
          echo "== build tree =="
          ls -la build 2>/dev/null | head -30 || echo "no build/ dir"
          echo
          echo "== tonto binary =="
          if [ -x build/tonto ]; then
            file build/tonto
            ldd build/tonto || true
          else
            echo "!!! build/tonto MISSING or not executable"
            echo "    -> the BUILD failed; the cause is in the 'Build' step log above."
            echo '```'
            exit 0
          fi
          echo
          echo "== one canonical short test (h2o_rhf_STO-3G), raw =="
          # TRUNCATE FOR DISPLAY, NEVER FOR CAPTURE. The full output goes to a
          # file that is uploaded unconditionally; only what a human reads on the
          # summary is tailed. The previous form piped straight to `tail -25`, so
          # the other lines existed nowhere -- and `|| true` discarded the exit
          # status on top of that.
          mkdir -p diagnostics
          python3 scripts/test.py -t tests/short/h2o_rhf_STO-3G -p "$PWD/build/tonto" \
            --basis-sets "$PWD/basis_sets" --log-level=INFO \
            > diagnostics/raw-test.log 2>&1 || echo "(raw test exited $?)"
          echo "(full output in the ci-diagnostics artifact: diagnostics/raw-test.log)"
          tail -25 diagnostics/raw-test.log
          echo
          echo "== reference-vs-.bad diffs =="
          # Name every .bad, not just the first. All of them are uploaded, so the
          # summary showing one is display truncation -- but a reader who is not
          # told there were nine will not go looking for the other eight.
          bads=$(find tests/short -name '*.bad' 2>/dev/null | sort)
          n=$(printf '%s\n' "$bads" | grep -c . || true)
          if [ "$n" -gt 0 ]; then
            echo "$n .bad file(s):"
            printf '%s\n' "$bads" | sed 's/^/  /'
            first=$(printf '%s\n' "$bads" | head -1)
            echo
            echo "diff ${first%.bad}  vs  $first  (first 80 lines; all are in the artifact):"
            diff "${first%.bad}" "$first" | head -80 || true
          else
            echo "(no .bad produced -> h2o_rhf_STO-3G PASSED; failures are test-specific, not universal)"
          fi
          echo '```'
          exit 0

      - name: Test (short + hart suites) + agreement report + invariant checks
        # scripts/suite_report.py runs each job and prints a per-test
        # table with three verdict columns -- Exact / Loose / Last-digit -- plus
        # the worst relative % and worst last-place (ulp) error, with per-suite
        # subtotals and a grand total. It then runs the INVARIANT CHECKS, which
        # compare the program against itself rather than against a stored
        # reference (e.g. spherical vs cartesian bases must agree below d
        # functions) -- these need no reference output, so unlike the table they
        # cannot be silently blessed by regenerating references on a broken
        # build. They exist because a gfortran miscompilation on arm64 macOS
        # went unnoticed for want of exactly such a check.
        # It exits non-zero iff any test fails the LOOSE gate (rel <= 0.2% OR
        # last-digit <= 2) OR an invariant check fails, so that decides
        # red/green.
        # The table is echoed to the run's front-page Job Summary and also saved
        # to tests.log (uploaded below), so a red run shows *which* tests broke
        # and by how much -- the shape of the numeric drift -- at a glance.
        run: |
          set -o pipefail
          {
            echo '## Test agreement report — short + hart suites'
            echo ''
            echo 'Columns: **Exact / Loose / Last-digit**.  Gate = **Loose** (rel ≤ 0.2% OR last-digit ≤ 2).'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # --failure-dir: a crashed job produces no .bad, so without this an ERROR
          # row records no cause anywhere. See scripts/suite_report.py.
          python3 scripts/suite_report.py \
            --program build/tonto --tests-dir tests --basis-sets basis_sets \
            --suites short hart --log tests.log \
            --failure-dir test-failures | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload agreement report + any .bad outputs
        if: always()   # keep the artifacts even when earlier steps went red
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            tests.log
            tests/**/*.bad
            test-failures/**
            diagnostics/**
          if-no-files-found: warn
