name: CI (Linux-MPI)

# First CI coverage of the MPI build. Before milestone 4 (2026-08-01) no MPI build
# had ever been configured -- not in CI, not in install-all.sh, not in any local
# build tree -- and eight reductions were silently returning wrong answers because
# nothing executed them. See docs/MPI.md.
#
# WHY THIS IS NOT ON EVERY PUSH. Ubuntu's Open MPI is built against gcc-13 while
# the project standardises on gfortran-14, and Tonto does `USE mpi` -- Fortran .mod
# files are compiler-version specific, so the packaged MPI simply cannot be used
# (configure now stops with a clear message rather than failing deep in the build).
# So this workflow builds Open MPI from source, which is why it is cached and why
# it runs on a schedule / on demand / on MPI-relevant changes rather than every
# push. Same pattern as ci-wsl.yml's expensive wsl-build job.
on:
  workflow_dispatch:          # the button: Actions -> CI (Linux-MPI) -> Run workflow
  schedule:
    - cron: '17 5 * * 1'      # Mondays 05:17 UTC
  push:
    branches: [antlr4, master, release]
    paths:                    # only when something MPI-relevant moves
      # The parallel layer itself.
      - 'foofiles/parallel.foo'
      - 'foofiles/system.foo'
      - 'include/macros.in'
      # The I/O layer: every rank-vs-master guard lives in these two, and a
      # change to either can turn a correct write into a concurrent one.
      - 'foofiles/file.foo'
      - 'foofiles/archive.foo'
      # Files carrying rows in the defect register (docs/MPI.md): reductions,
      # per_rank_write sites, raw writes on a *.unit expression. Added
      # 2026-08-02 -- BOTH per_rank_write fixes landed in molecule.har.foo and
      # crystal.foo, and neither would have triggered this workflow.
      - 'foofiles/crystal.foo'
      - 'foofiles/molecule.har.foo'
      - 'foofiles/molecule.rho.foo'
      - 'foofiles/molecule.grid.foo'
      - 'foofiles/molecule.fock.foo'
      - 'foofiles/molecule.scf.foo'
      - 'foofiles/molecule.prop.foo'
      - 'foofiles/molecule.put.foo'
      - 'foofiles/plot_grid.foo'
      # The harness and the gate.
      - 'runfiles/run_mpi_*.foo'
      - 'scripts/check_mpi_pi.sh'
      - 'scripts/test.py'
      - 'scripts/suite_report.py'
      - '.github/workflows/ci-mpi.yml'
      #
      # NOTE: this list is a heuristic and cannot be complete -- what actually
      # matters is whether a change touches a PARALLEL_* macro, a per_rank_write
      # or a raw write on a *.unit, and `paths:` cannot express that. The weekly
      # schedule and the manual dispatch are the backstop. The translator lint
      # proposed in milestone 6 would be the real answer.

env:
  OMPI_VERSION: 5.0.9
  OMPI_PREFIX: /home/runner/opt/openmpi-gf14
  FC_VERSION: 14

jobs:
  mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gfortran-14 gcc-14 libblas-dev liblapack-dev \
            default-jdk python3 perl make cmake

      # Keyed on (Open MPI version, gfortran version) because THAT PAIR is exactly
      # what the .mod compatibility depends on. A cold cache costs ~8-10 min; a warm
      # one, seconds.
      - name: Cache Open MPI (built with gfortran-14)
        id: ompi-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OMPI_PREFIX }}
          key: ompi-${{ env.OMPI_VERSION }}-gfortran${{ env.FC_VERSION }}-${{ runner.os }}

      - name: Build Open MPI with gfortran-14
        if: steps.ompi-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -O https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-${OMPI_VERSION}.tar.bz2
          tar xf openmpi-${OMPI_VERSION}.tar.bz2
          cd openmpi-${OMPI_VERSION}
          ./configure --prefix="$OMPI_PREFIX" \
                      FC=gfortran-14 F77=gfortran-14 CC=gcc-14 CXX=g++-14 \
                      --disable-mpi-cxx > configure.log 2>&1 || { tail -30 configure.log; exit 1; }
          make -j"$(nproc)" > make.log 2>&1 || { tail -30 make.log; exit 1; }
          make install > install.log 2>&1

      # ARTEFACT check, not a process check. Every verification in this workflow
      # asserts on something on disk, because a whole day of milestone-4 debugging
      # was lost to checks that could not see what they were checking (a stale
      # binary reported as fresh, a pgrep matching its own shell).
      - name: Verify the MPI toolchain matches the compiler
        run: |
          set -euo pipefail
          "$OMPI_PREFIX/bin/mpifort" --version | head -1
          "$OMPI_PREFIX/bin/mpifort" --version | head -1 | grep -q "14\." \
            || { echo "::error::mpifort does not wrap gfortran-14"; exit 1; }
          printf 'program t\n  use mpi\n  implicit none\n  integer :: e\n  call MPI_Init(e)\n  call MPI_Finalize(e)\nend program t\n' > t.f90
          "$OMPI_PREFIX/bin/mpifort" t.f90 -o t
          "$OMPI_PREFIX/bin/mpirun" -n 2 --oversubscribe ./t
          echo "use mpi compiles and runs under the matching launcher"

      - name: Configure and build (MPI)
        run: |
          set -euo pipefail
          cmake -B build-mpi \
                -DCMAKE_Fortran_COMPILER="$OMPI_PREFIX/bin/mpifort" \
                -DCMAKE_C_COMPILER="$OMPI_PREFIX/bin/mpicc" \
                -DMPI=1 -DCMAKE_BUILD_TYPE=release
          cmake --build build-mpi -- -j2

      # -DMPI=1 used to be able to produce a SERIAL binary silently (FindMPI miss was
      # only a STATUS line). It is fatal now, but assert the artefact anyway.
      - name: Assert the binary really is MPI-linked
        run: |
          set -euo pipefail
          test -x build-mpi/tonto
          ldd build-mpi/tonto | grep -q "libmpi" \
            || { echo "::error::build-mpi/tonto is not linked against libmpi"; exit 1; }
          ldd build-mpi/tonto | grep libmpi | head -3
          grep -q "DMPI=1" build-mpi/CMakeFiles/tonto.dir/flags.make \
            || echo "::warning::-DMPI=1 not found in flags.make (check the build)"

      # THE GATE. Rank-count invariance of pi: one `parallel do`, one PARALLEL_SUM --
      # the whole macro surface every parallel routine depends on, against an answer
      # known in advance that must not change with the rank count. Needs no stored
      # reference, so unlike the suite it cannot be silently blessed. The four dead
      # reductions found in milestone 4 would all have failed it.
      - name: MPI invariant — pi is rank-count independent (GATING)
        run: |
          set -euo pipefail
          sh scripts/check_mpi_pi.sh build-mpi/run_mpi_pi \
             "$OMPI_PREFIX/bin/mpirun" 1 2 4 | tee mpi_pi.log

      # INFORMATIONAL until the register in docs/MPI.md is clear. Three known rows
      # remain (HAR parallel_write writing the same file from every rank, the
      # SYSTEM:initialize broadcast-in-a-master-guard deadlock, the commented-out
      # MPI_ABORT), so a gating suite would be permanently red -- the same reasoning
      # ci-debug.yml uses for the four longstanding -O0 failures.
      # -n 2, not 4: the runner has 4 vCPUs and the launcher would oversubscribe.
      - name: Short suite under MPI at 2 ranks (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## MPI short suite — 2 ranks (informational)'
            echo ''
            echo 'Gate for this workflow is the pi rank-invariance check, not this table.'
            echo 'See docs/MPI.md for the defect register and what is still open.'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -u scripts/suite_report.py \
            --program build-mpi/tonto --tests-dir tests --basis-sets basis_sets \
            --suites short --no-log \
            --mpi --mpi-ranks 2 --mpi-launcher "$OMPI_PREFIX/bin/mpirun" \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -30
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and any .bad outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpi-diagnostics
          path: |
            mpi_pi.log
            tests/**/*.bad
          if-no-files-found: warn
