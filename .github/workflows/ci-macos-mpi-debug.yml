name: macOS-MPI-debug

# The parallel debug build on Apple silicon: gfortran-14, Open MPI built with
# the same compiler, array bounds checks and Tonto's internal checks live in the
# parallel code. Passes or fails on the pi check and on two short jobs at 2
# processes. The steps are in mpi-macos.yml, shared with ci-macos-mpi.yml.

on:
  push:                      # TEMPORARY: run on this branch before merging; remove
    branches: [mpi-ci-gfortran14]
  schedule:
    - cron: '51 4 * * 4'      # Thursdays 04:51 UTC
  workflow_dispatch:

jobs:
  mpi:
    uses: ./.github/workflows/mpi-macos.yml
    with:
      build_type: debug
